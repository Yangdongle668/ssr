# Nginx 配置：Clash YAML 下载服务
# 安全约束：
#   - 只允许 /<token>/clash.yaml 这一种路径
#   - 禁止目录列表
#   - 默认 404 兜底
#   - 加上 attachment header，浏览器/Clash 直接保存

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    autoindex off;
    server_tokens off;

    # 禁止访问以点开头的隐藏文件
    location ~ /\. {
        deny all;
        return 404;
    }

    # 仅放行 /<8字符以上 token>/clash.yaml
    location ~ ^/[a-zA-Z0-9_-]{8,}/clash\.yaml$ {
        default_type application/x-yaml;
        add_header Content-Disposition 'attachment; filename="clash.yaml"';
        add_header Cache-Control 'no-cache, no-store, must-revalidate';
        add_header X-Content-Type-Options 'nosniff';
        try_files $uri =404;
    }

    # 其它一律 404
    location / {
        return 404;
    }

    # 健康检查路径（部署脚本用）
    location = /__health {
        access_log off;
        return 200 "ok\n";
    }
}
